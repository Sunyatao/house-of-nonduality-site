name: Build for Porkbun Static Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Add nojekyll file
        run: touch dist/.nojekyll

      - name: Deploy dist to porkbun-deploy branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: porkbun-deploy
          folder: dist
          clean: true